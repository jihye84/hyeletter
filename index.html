<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
<script>
/* 카카오톡·네이버·페이스북·인스타그램·라인·밴드 등 앱 안 브라우저로 열리면 기본 브라우저(크롬·사파리)로 다시 열기 */
(function () {
  if (window.top !== window.self) return;
  var ua = navigator.userAgent || '';
  var url = location.href;
  var inApp = /KAKAOTALK|KAKAOSTORY|NAVER\(inapp|NAVER\/|FBAN|FBAV|FB_IAB|FBIOS|Instagram|\bLine\/|DaumApps|BAND\/|everytimeApp|Whale\/[\d.]+ .*inapp|; wv\)/i.test(ua);
  if (!inApp) return;
  if (/KAKAOTALK/i.test(ua)) { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url); return; }
  if (/\bLine\//i.test(ua)) {
    if (url.indexOf('openExternalBrowser=1') < 0) location.href = url + (url.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1';
    return;
  }
  if (/Android/i.test(ua)) {
    location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
    return;
  }
  // 아이폰의 앱 안 브라우저는 사파리로 바로 넘길 수 없어 안내 화면을 띄움
  document.addEventListener('DOMContentLoaded', function () {
    var box = document.createElement('div');
    box.setAttribute('role', 'dialog');
    box.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:rgba(20,24,32,.94);color:#f2f3f6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font:15px/1.6 -apple-system,system-ui,sans-serif;word-break:keep-all';
    box.innerHTML = '<strong style="font-size:18px">사파리에서 열어 주세요</strong>' +
      '<span>이 앱 안의 브라우저에서는 소리나 화면이 제대로 작동하지 않을 수 있어요.<br>오른쪽 아래 ⋯ 또는 공유 버튼에서 <b>Safari로 열기</b>를 눌러 주세요.</span>' +
      '<button type="button" data-a="copy" style="font:inherit;padding:10px 20px;border-radius:999px;border:0;background:#f2f3f6;color:#141820">주소 복사</button>' +
      '<button type="button" data-a="stay" style="font:inherit;background:none;border:0;color:#aab0bd;text-decoration:underline">그냥 여기서 보기</button>';
    box.addEventListener('click', function (e) {
      var a = e.target.getAttribute && e.target.getAttribute('data-a');
      if (a === 'stay') box.remove();
      if (a === 'copy') {
        var b = e.target;
        (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(
          function () { b.textContent = '복사했어요'; },
          function () { window.prompt('주소를 복사해 사파리에 붙여 넣어 주세요', url); });
      }
    });
    document.body.appendChild(box);
  });
})();
</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>히에로글리프 학습</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Nanum+Pen+Script&family=Noto+Sans+Egyptian+Hieroglyphs&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #eaddca 0%, #d2b48c 100%);
            --card-bg: #ffffff;
            --primary: #8b4513;
            --text-color: #3e2723;
            --accent: #d7c4a3;
        }

        body {
            font-family: 'Nanum Gothic', sans-serif;
            background: var(--bg-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            overflow-y: auto;
        }

        #main-container {
            background: var(--card-bg);
            padding: 40px 25px;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 8px solid #fdfbf7;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            color: var(--primary);
            margin: 0 0 10px 0;
            font-size: 28px;
            font-weight: 800;
        }

        p.subtitle {
            color: #5d4037;
            margin: 0 0 20px 0;
            font-size: 16px;
        }

        button.option-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: none;
        }

        .menu-grid {
            display: grid;
            gap: 15px;
            grid-template-columns: repeat(2, 1fr);
            /* Changed to 2 columns for better uniformity */
        }

        a.menu-btn {
            display: flex;
            flex-direction: column;
            /* Stack vertically for 2-column layout */
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
            background: #fffdfa;
            color: var(--text-color);
            text-decoration: none;
            border-radius: 20px;
            box-shadow: 0 5px 0px #d7c4a3;
            transition: all 0.1s;
            font-weight: 700;
            font-size: 18px;
            border: 2px solid transparent;
            height: 120px;
            /* Fixed height for uniformity */
        }

        a.menu-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        a.menu-btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        .glyph-icon {
            font-family: 'Noto Sans Egyptian Hieroglyphs', 'Segoe UI Historic', 'Apple Symbols', sans-serif;
            font-size: 40px;
            /* Larger icon */
            color: var(--primary);
            margin-bottom: 10px;
        }

        .level-tag {
            background: #efebe9;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #795548;
            margin-bottom: 5px;
            /* Moved to middle */
            display: none;
            /* Hidden for clearer 2-col look, or we can keep it? Let's hide it for cleaner buttons or make it small */
        }

        /* Let's keep the tag but style it better for vertical button */
        .level-tag {
            display: inline-block;
            margin: 0 0 5px 0;
            font-size: 11px;
            opacity: 0.8;
        }
    
        /* ── 어떤 화면에서도 스크롤 없이 한 화면에 ── */
        html, body { height: 100%; }
        body { min-height: 0; height: 100vh; height: 100dvh; overflow: hidden; }
        #main-container { box-sizing: border-box; max-height: calc(100dvh - 16px); padding: clamp(12px, 4vh, 40px) clamp(12px, 3vw, 25px); gap: clamp(6px, 2vh, 20px); border-width: clamp(4px, 0.8vh, 8px); }
        h1 { font-size: clamp(20px, 4vh, 28px); margin-bottom: clamp(2px, 1vh, 10px); }
        p.subtitle { margin-bottom: clamp(2px, 2vh, 20px); font-size: clamp(13px, 2vh, 16px); }
        .menu-grid { gap: clamp(8px, 1.8vh, 15px); }
        a.menu-btn { height: clamp(64px, 14vh, 120px); padding: clamp(6px, 1.6vh, 20px) 10px; font-size: clamp(15px, 2.4vh, 18px); box-sizing: border-box; }
        .glyph-icon { font-size: clamp(22px, 5vh, 40px); margin-bottom: clamp(2px, 1vh, 10px); }
        .level-tag { margin-bottom: clamp(1px, 0.6vh, 5px); }
        @media (max-height: 560px) {
            #main-container { max-width: 760px; }
            .menu-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            p.subtitle { display: none; }
            .level-tag { display: none !important; }
            a.menu-btn { flex-direction: row; gap: 10px; }
            .glyph-icon { margin-bottom: 0; }
        }
    </style>
</head>

<body>

    <div id="main-container">
        <div>
            <h1>히에로글리프 학습</h1>
            <p class="subtitle">고대 이집트 상형문자 퀴즈</p>
        </div>

        <div class="menu-grid">
            <a href="one.html" class="menu-btn">
                <span class="level-tag">기초</span>
                <span class="glyph-icon">𓄿</span>
                <span>1음절</span>
            </a>
            <a href="two.html" class="menu-btn">
                <span class="level-tag">중급</span>
                <span class="glyph-icon">𓎟</span>
                <span>2음절</span>
            </a>
            <a href="three.html" class="menu-btn">
                <span class="level-tag">고급</span>
                <span class="glyph-icon">𓋹</span>
                <span>3음절</span>
            </a>
            <a href="four.html" class="menu-btn">
                <span class="level-tag">심화</span>
                <span class="glyph-icon">𓄪</span>
                <span>4음절</span>
            </a>
            <a href="five.html" class="menu-btn">
                <span class="level-tag">마스터</span>
                <span class="glyph-icon">𓉡</span>
                <span>5+음절</span>
            </a>
            <a href="mix.html" class="menu-btn">
                <span class="level-tag">종합</span>
                <span class="glyph-icon">𓏞</span>
                <span>전체 학습</span>
            </a>
        </div>

        <footer>
            Created with Antigravity
        </footer>
    </div>

</body>

</html>
